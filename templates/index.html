    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #f4f4f5; }
        .nav { padding: 0 32px; display: flex; align-items: center; height: 52px; border-bottom: 1px solid #27272a; background: #18181b; gap: 2px; }
        .nav-brand { font-weight: 700; color: #f4f4f5; font-size: 1rem; text-decoration: none; display: flex; align-items: center; gap: 8px; padding-right: 22px; }
        .nav-link { color: #71717a; text-decoration: none; padding: 0 14px; height: 52px; display: flex; align-items: center; font-size: 0.875rem; }
        .nav-link:hover { color: #f4f4f5; }
        .nav-link.active { color: #f4f4f5; font-weight: 600; }
        .nav-right { margin-left: auto; }
        .nav-btn { border: 1px solid #3f3f46; color: #f4f4f5; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .nav-btn:hover { border-color: #71717a; }
        .container { max-width: 100%; margin: 0 auto; padding: 24px 32px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 0; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 10px; overflow: hidden; }
        .card:hover { border-color: #3f3f46; background: #1c1c1f; }
        .card-thumb { width: 100%; height: 100px; display: flex; align-items: center; justify-content: center; background: #18181b; border-bottom: 1px solid #27272a; }
        .card-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .card-thumb-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #3f3f46; font-size: 2rem; font-weight: 700; font-family: sans-serif; }
        .card-content { padding: 12px 14px; }
        .card-title { color: #f4f4f5; text-decoration: none; font-weight: 600; font-size: 0.9rem; line-height: 1.35; display: block; }
        .empty-state { color: #71717a; padding: 20px 0; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/" class="nav-brand"><svg width="22" height="22" viewBox="0 0 200 200" fill="none"><g clip-path="url(#cs_clip_1_ellipse-12)"><mask id="cs_mask_1_ellipse-12" style="mask-type:alpha" width="200" height="200" x="0" y="0" maskUnits="userSpaceOnUse"><path fill="#fff" fill-rule="evenodd" d="M100 150c27.614 0 50-22.386 50-50s-22.386-50-50-50-50 22.386-50 50 22.386 50 50 50zm0 50c55.228 0 100-44.772 100-100S155.228 0 100 0 0 44.772 0 100s44.772 100 100 100z" clip-rule="evenodd"></path></mask><g mask="url(#cs_mask_1_ellipse-12)"><path fill="#fff" d="M200 0H0v200h200V0z"></path><path fill="#FAFF02" fill-opacity="0.33" d="M200 0H0v200h200V0z"></path><g filter="url(#filter0_f_844_2811)"><path fill="#FFE500" d="M110 32H18v68h92V32z"></path><path fill="#FF001F" d="M188-24H15v98h173v-98z"></path><path fill="#18A0FB" d="M175 70H5v156h170V70z"></path><path fill="#FF00D6" d="M230 51H100v103h130V51z"></path></g></g></g><defs><filter id="filter0_f_844_2811" width="385" height="410" x="-75" y="-104" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend><feGaussianBlur result="effect1_foregroundBlur_844_2811" stdDeviation="40"></feGaussianBlur></filter><clipPath id="cs_clip_1_ellipse-12"><path fill="#fff" d="M0 0H200V200H0z"></path></clipPath></defs><g style="mix-blend-mode:overlay" mask="url(#cs_mask_1_ellipse-12)"><path fill="gray" stroke="transparent" d="M200 0H0v200h200V0z" filter="url(#cs_noise_1_ellipse-12)"></path></g><defs><filter id="cs_noise_1_ellipse-12" width="100%" height="100%" x="0%" y="0%" filterUnits="objectBoundingBox"><feTurbulence baseFrequency="0.6" numOctaves="5" result="out1" seed="4"></feTurbulence><feComposite in="out1" in2="SourceGraphic" operator="in" result="out2"></feComposite><feBlend in="SourceGraphic" in2="out2" mode="overlay" result="out3"></feBlend></filter></defs></svg>Vidly</a>
        <a href="/" class="nav-link active">Home</a>
        <div class="nav-right"></div>
        <a href="/upload" class="nav-btn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 1v12M1 7h12"/></svg>Upload</a>
    </nav>

    <div class="container">
        {% if movies.is_empty() %}
            <p class="empty-state">No movies yet.</p>
        {% else %}
            <div class="grid">
                {% for movie in movies %}
                <div class="card">
                    <div class="card-thumb">
                        {% if movie.thumb.is_empty() %}
                        <div class="card-thumb-placeholder">?</div>
                        {% else %}
                        <img src="{{ movie.thumb }}" alt="{{ movie.title }}" onerror="this.outerHTML='<div class=card-thumb-placeholder>?</div>'" />
                        {% endif %}
                    </div>
                    <div class="card-content">
                        <a href="/movies/{{ movie.id }}" class="card-title">{{ movie.title }}</a>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
